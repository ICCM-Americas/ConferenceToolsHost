name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # The `secrets` context is not available to a step's `if`, so the token is
    # exposed as an environment variable the upload step can test for.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check out branding package
        uses: actions/checkout@v7
        with:
          repository: ICCM-Americas/branding
          path: packages/conference-tools/branding

      - name: Check out bof-scheduler package
        uses: actions/checkout@v7
        with:
          repository: ICCM-Americas/bof-scheduler
          path: packages/conference-tools/bof-scheduler

      - name: Check out registration package
        uses: actions/checkout@v7
        with:
          repository: ICCM-Americas/registration
          path: packages/conference-tools/registration

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, zip
          coverage: xdebug

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Copy environment file
        run: cp .env.example .env && php artisan key:generate

      - name: Publish package assets
        run: php artisan vendor:publish --tag=laravel-assets --ansi --force

      - name: Run Pint formatting check
        id: pint
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Run tests with coverage
        id: tests
        run: composer test:coverage:github
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: steps.tests.outcome == 'success' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/clover.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run UI tests
        id: ui
        run: npm run test:ui
        continue-on-error: true

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            tests/ui/screenshots
            tests/ui/.report
            tests/ui/.results
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize results
        if: always()
        run: |
          echo ""
          echo "=== CI Results ==="
          echo "Formatting (Pint):  ${{ steps.pint.outcome }}"
          echo "Tests:              ${{ steps.tests.outcome }}"
          echo "UI tests:           ${{ steps.ui.outcome }}"
          echo "=================="
          if [ "${{ steps.pint.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.ui.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Request changes on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const failures = [];
            if ('${{ steps.pint.outcome }}' !== 'success') {
              failures.push('**Formatting:** Run `vendor/bin/pint` locally and commit the result.');
            }
            if ('${{ steps.tests.outcome }}' !== 'success') {
              failures.push('**Tests:** Run `composer test:coverage` locally and fix the failures.');
            }
            if ('${{ steps.ui.outcome }}' !== 'success') {
              failures.push('**UI tests:** Run `npm run test:ui` locally and fix the failures. The workflow run\'s `ui-test-results` artifact has the screenshots, report and traces.');
            }
            if (failures.length > 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'REQUEST_CHANGES',
                body: 'CI checks failed. Please address the following before merging:\n\n' + failures.join('\n'),
              });
            }
